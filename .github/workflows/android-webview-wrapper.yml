name: Build Saudi Ceramics WebView APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-webview-wrapper/**'
      - '.github/workflows/android-webview-wrapper.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android-webview-wrapper assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saudi-ceramics-webview-debug-apk
          path: android-webview-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
